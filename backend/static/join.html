<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saathi call</title>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
<style>
  body { font: 17px system-ui, sans-serif; margin: 0; padding: 28px 20px; text-align: center; background: #fff7f5; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  #who { color: #555; margin-bottom: 26px; }
  button { font-size: 20px; padding: 18px 28px; border-radius: 40px; border: 0; cursor: pointer; }
  #go { background: #1a7f37; color: #fff; } #end { background: #c62828; color: #fff; display: none; }
  #status { margin-top: 20px; color: #333; }
  .lvl { height: 10px; background: #eee; margin: 22px auto 0; max-width: 320px; border-radius: 5px; overflow: hidden; }
  .lvl div { height: 100%; width: 0; background: #1a7f37; }
</style>
</head>
<body>
<h1>Saathi</h1>
<div id="who">Emergency call</div>
<button id="go">Tap to join the call</button>
<button id="end">End call</button>
<div id="status"></div>
<div class="lvl"><div id="lvl"></div></div>
<script>
const $ = id => document.getElementById(id);
const sid = location.pathname.split('/').pop();
let client, mic;
fetch('/api/s/' + sid).then(r => r.json()).then(i => { $('who').textContent = i.label ? `Saathi call · ${i.label}` : (i.detail || ''); });

$('go').onclick = async () => {
  $('go').disabled = true; $('status').textContent = 'Connecting…';
  try {
    const info = await (await fetch('/api/s/' + sid)).json();
    if (!info.token) throw new Error(info.detail || 'This call has ended.');
    client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
    client.on('user-published', async (user, type) => {
      if (type !== 'audio') return;
      await client.subscribe(user, 'audio'); user.audioTrack.play();
      setInterval(() => { if (user.audioTrack) $('lvl').style.width = (user.audioTrack.getVolumeLevel() * 100) + '%'; }, 80);
    });
    await client.join(info.app_id, info.channel, info.token, info.uid);
    mic = await AgoraRTC.createMicrophoneAudioTrack({ AEC: true, ANS: true, AGC: true });
    await client.publish([mic]);
    await fetch(`/api/s/${sid}/joined`, { method: 'POST' });
    $('status').textContent = 'Connected. Saathi is speaking — you can talk and ask questions.';
    $('go').style.display = 'none'; $('end').style.display = 'inline-block';
  } catch (e) { $('status').textContent = e.message; $('go').disabled = false; }
};
$('end').onclick = async () => {
  if (mic) mic.close(); if (client) await client.leave();
  $('status').textContent = 'Call ended.'; $('end').style.display = 'none';
};
</script>
</body>
</html>
